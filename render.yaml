services:
  - type: web
    name: rescueswarm-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_HOST
        value: 0.0.0.0
      - key: LLM_PROVIDER
        value: mock
      - key: LLM_API_KEY
        value: ""
      - key: DATABASE_URL
        value: sqlite:///./rescueswarm.db
      - key: CORS_ORIGINS
        sync: false   # set this in Render dashboard to your Vercel URL after deploy
    plan: free
